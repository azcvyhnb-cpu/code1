name: Assemble main.lua

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble
        run: |
          set -e
          cat .build/main.part* > main.lua
          rm -rf .build
          rm -f .github/workflows/assemble-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Assemble Anime Dice WindUI main.lua"
          git push
